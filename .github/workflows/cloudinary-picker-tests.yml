name: Django admin Cloudinary picker tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run Cloudinary picker tests (mocked API)
        run: python manage.py test website.tests_cloudinary_picker
