{% if homepage_tiktoks %}
<div class="homepage-tiktok-favorites reveal" aria-label="Featured TikTok favorites">
  {% for tiktok in homepage_tiktoks %}
  <article class="homepage-tiktok-card">
    <div class="homepage-tiktok-player">
      <iframe
        src="{{ tiktok.embed_url }}"
        title="{{ tiktok.title }} TikTok video"
        loading="lazy"
        allow="encrypted-media; fullscreen"
        allowfullscreen
      ></iframe>
    </div>
    <div class="homepage-tiktok-caption">
      <div>
        {% if tiktok.brand_name %}<span>{{ tiktok.brand_name }}</span>{% endif %}
        <h3>{{ tiktok.title }}</h3>
      </div>
      <a href="{{ tiktok.tiktok_url }}" target="_blank" rel="noopener">View on TikTok ↗</a>
    </div>
  </article>
  {% endfor %}
</div>
{% endif %}
